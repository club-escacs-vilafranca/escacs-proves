name: PROVA · Actualitzar resultats d'Info64 (FEDA)
# DESCOBRIMENT (dilluns): busca a Info64 els torneigs nous dels últims 30 dies on han jugat els jugadors del club (Campionats d'Espanya, oberts, etc.).
# SEGUIMENT (la resta de dies): només mira els jugadors que tenen un torneig en curs; si no n'hi ha cap, ni obre el navegador.
# Desa les partides a data/info64-jugadors.json. Després «Actualitzar jugadors i resultats» les incorpora a la web.
on:
  workflow_dispatch:
    inputs:
      des:
        description: "Data d'inici (AAAA-MM-DD); buit = l'1 de gener de l'any en curs"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  info64:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      NOMES_PROVA: "1"
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Decideix el mode
        id: mode
        run: |
          DES="${{ inputs.des }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DES=$(date -d '30 days ago' +%F)
            [ "${{ github.event.schedule }}" = "41 1 * * 1" ] && SEG="" || SEG="--seguiment"
          else SEG=""; fi
          echo "des=$DES" >> "$GITHUB_OUTPUT"; echo "seg=$SEG" >> "$GITHUB_OUTPUT"
          pip install -q beautifulsoup4 playwright
          if [ -n "$SEG" ] && [ "$(python3 tools/info64.py $DES --pendents | tail -1)" = "0" ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Seguiment: cap torneig en curs, no cal fer res." | tee -a "$GITHUB_STEP_SUMMARY"; else echo "run=si" >> "$GITHUB_OUTPUT"; fi
      - if: steps.mode.outputs.run == 'si'
        run: playwright install --with-deps chromium
      - if: steps.mode.outputs.run == 'si'
        run: python3 -u tools/info64.py ${{ steps.mode.outputs.des }} ${{ steps.mode.outputs.seg }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Xifra els resultats (la clau pública és al repositori; només la llegeix qui té la privada)
        run: |
          gpg --batch --import proves-public.asc
          git status --porcelain data | sed 's/^...//' > /tmp/canvis.txt; cat /tmp/canvis.txt
          tar czf - -T /tmp/canvis.txt 2>/dev/null | gpg --batch --trust-model always -r proves-escacs -e -o resultats.tgz.gpg || true
          ls -la resultats.tgz.gpg || echo "Sense canvis."
      - name: Desa el resultat xifrat al repositori (només es pot llegir amb la clau privada del club)
        run: |
          [ -f resultats.tgz.gpg ] || { echo "Sense canvis."; exit 0; }
          mkdir -p resultats-xifrats
          NOM="resultats-xifrats/$(basename "${GITHUB_WORKFLOW_REF%%@*}")-${GITHUB_RUN_NUMBER}.gpg"; cp resultats.tgz.gpg "$NOM"
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add resultats-xifrats
          git commit -qm "Resultat xifrat de ${GITHUB_WORKFLOW}" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
