name: Prova Info64
# Només a mà. Mateix codi que el repositori privat, però només amb la jugadora autoritzada (data/jugadors.json).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
    timeout-minutes: 45
    env:
      NOMES_PROVA: "1"
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q beautifulsoup4 playwright && playwright install --with-deps chromium
      - run: python3 -u tools/info64.py 2026-01-01 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resum sense dades d'altres jugadors (no es desa res al repositori)
        run: python3 tools/resum_prova.py
