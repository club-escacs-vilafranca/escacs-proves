name: Prova de connexions
# Només s'executa quan tu ho demanes (Actions > Prova de connexions > Run workflow).
# No modifica res de la web: només comprova a quines fonts es pot arribar des de GitHub.
on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Comprova les fonts
        run: bash tools/prova-connexions.sh | tee -a "$GITHUB_STEP_SUMMARY"
