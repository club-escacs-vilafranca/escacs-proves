name: PROVA · Performance dels rivals sense Elo
# Llegeix de Chess-Results la performance dels rivals de data/perf_pendents.json. Només a mà. El resultat surt xifrat.
on: workflow_dispatch

permissions:
  contents: write
concurrency: perf-rivals

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q beautifulsoup4
      - run: python3 -u tools/perf_rivals.py 1.0 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Xifra el resultat (només es pot llegir amb la clau privada del club)
        run: |
          gpg --batch --import proves-public.asc
          tar czf - data/perf_rivals.json | gpg --batch --trust-model always -r proves-escacs -e -o resultats.tgz.gpg
          mkdir -p resultats-xifrats
          cp resultats.tgz.gpg "resultats-xifrats/perf-rivals.yml-${GITHUB_RUN_NUMBER}.gpg"
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add resultats-xifrats
          git commit -qm "Resultat xifrat de ${GITHUB_WORKFLOW}" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
